<nav class="main-navbar" [class.sticky]="isSticky">
    <app-ornament-corners direction="up" size="100%" edgeOffset="0px" [opacity]="0.24" [saturation]="0.72" [brightness]="1.06" [mirrorLeft]="true" [mirrorRight]="false" imageUrl="/assets/images/pngtree-islamic-corner-frame-png-image_7096173.webp"></app-ornament-corners>
    <div class="container navbar-container">
        
        <div class="navbar-brand">
            <a routerLink="/" (click)="closeMobileMenu()" aria-label="I Quran home">
                <img
                    src="assets/images/logo.webp"
                    alt="I Quran"
                    class="brand-logo"
                    width="584"
                    height="621"
                    decoding="async"
                    fetchpriority="high"
                />
            </a>
        </div>

        
        <div id="primary-navigation" class="navbar-menu" [class.active]="!isCollapsed">
            <ul class="nav-links">
                <li *ngFor="let item of menuItems" [class.has-dropdown]="item.children?.length">
                    <a *ngIf="item.route" [routerLink]="item.route" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: item.route === '/'}" (click)="closeMobileMenu()">
                        {{ item.label | translate }}
                    </a>
                    <button *ngIf="item.children?.length" type="button" class="nav-dropdown-toggle" [class.active]="isMenuItemActive(item)">
                        {{ item.label | translate }}
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <ul *ngIf="item.children?.length" class="dropdown-links">
                        <li *ngFor="let child of item.children">
                            <a [routerLink]="child.route" routerLinkActive="active" (click)="closeMobileMenu()">
                                {{ child.label | translate }}
                            </a>
                        </li>
                    </ul>
                </li>
            </ul>

            <div class="navbar-actions">
                <a routerLink="/teacher-application" routerLinkActive="active" class="nav-action secondary" (click)="closeMobileMenu()">
                    Apply as Teacher
                </a>
                <a routerLink="/contacts" routerLinkActive="active" class="nav-action primary" (click)="closeMobileMenu()">
                    {{ 'BOOK_TRIAL' | translate }}
                </a>
            </div>
        </div>

        <div class="navbar-mobile-controls">
            <button
            type="button"
            class="mobile-toggle"
            (click)="toggleMobileMenu()"
            [class.active]="!isCollapsed"
            [attr.aria-expanded]="!isCollapsed"
            aria-controls="primary-navigation"
            [attr.aria-label]="currentLanguage === 'ar' ? (!isCollapsed ? 'Ø¥ØºÙ„Ø§Ù‚ Ø§Ù„Ù‚Ø§Ø¦Ù…Ø© Ø§Ù„Ø±Ø¦ÙŠØ³ÙŠØ©' : 'ÙØªØ­ Ø§Ù„Ù‚Ø§Ø¦Ù…Ø© Ø§Ù„Ø±Ø¦ÙŠØ³ÙŠØ©') : (!isCollapsed ? 'Close main menu' : 'Open main menu')"
        >
            <span></span>
            <span></span>
            <span></span>
            </button>
        </div>
    </div>
</nav>
